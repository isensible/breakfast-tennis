<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Each session is a court sheet: one lane per court on a shared time axis.
   The dashed "chalk" box marks the published session; green blocks are bookings. */
:root {
  --bg: #f2f5f1; --surface: #ffffff; --ink: #15221b; --muted: #5a6a61; --line: #d4ddd5;
  --lane: #e9eee9; --window: #f8fbf8;
  --court: #1d6a4c; --court-ink: #ffffff; --court-soft: #e0eee6; --ball: #c6d936; --ball-ink: #1d2408;
  --warn: #9a4b12; --warn-soft: #fbeee2; --scrim: rgba(12, 20, 16, .45);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1612; --surface: #15201a; --ink: #e4ede7; --muted: #92a399; --line: #2c3c33;
    --lane: #101914; --window: #1a2720;
    --court: #5cbd90; --court-ink: #0b1510; --court-soft: #1b3228; --ball: #b8cb2c; --ball-ink: #1d2408;
    --warn: #f0a868; --warn-soft: #33241a; --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 18px; }
.stack { display: grid; gap: 14px; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--court); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 2.1rem; line-height: 1; margin: 0; letter-spacing: .01em; }
h1 span { color: var(--court); margin-left: .25em; }
h1 { display: flex; align-items: center; }
h1 .logo { width: 1.25em; height: 1.25em; margin-right: .3em; flex: none; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: .92rem; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 7px 14px; border-radius: 7px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--court); color: var(--court-ink); }

.status { font-size: .88rem; padding: 8px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); }

.weeknav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.weeknav .label { font-family: var(--display); font-weight: 600; font-size: 1.35rem; letter-spacing: .02em; }
.weeknav .tally { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.weeknav .spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--court); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--court); border-color: var(--court); color: var(--court-ink); font-weight: 600; }
.btn.danger { color: var(--warn); }
.btn.icon { padding: 6px 10px; min-width: 38px; }

/* Session card */
.session { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 16px; display: grid; gap: 12px; min-width: 0; }
.session.past .session-head, .session.past .board { opacity: .62; } /* attendance stays full strength: it's filled in after play */
.session-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.session-head h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.1; }
.session-head .time { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
.session-head .count { margin-left: auto; font-variant-numeric: tabular-nums; font-size: .9rem; display: flex; gap: 10px; flex-wrap: wrap; }
.session-head .count b { font-weight: 600; }
.key { display: inline-flex; align-items: center; gap: 5px; }
.key i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.key .k-full { background: var(--court); }
.key .k-part { background: var(--ball); }
.key .k-free { border: 1.5px dashed var(--muted); }
.chip { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--court-soft); color: var(--court); }
.chip.plain { background: none; border: 1px solid var(--line); color: var(--muted); }

/* Court lanes */
.board { display: grid; gap: 5px; }
.row { display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px; gap: 8px; align-items: center; }
.axis { height: 16px; position: relative; font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.axis span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.axis span.first { transform: none; }
.axis span.last { transform: translateX(-100%); }
.num {
  height: 30px; border-radius: 7px; display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums;
  border: 1.5px dashed var(--line); color: var(--muted);
}
.num.full { background: var(--court); border-color: var(--court); color: var(--court-ink); }
.num.part { background: var(--ball); border-color: var(--ball); color: var(--ball-ink); }
.lane { position: relative; height: 30px; border-radius: 6px; background: var(--lane); cursor: copy; overflow: hidden; }
.lane.locked { cursor: not-allowed; }
.win { position: absolute; top: 0; bottom: 0; background: var(--window); border: 1.5px dashed var(--line); border-radius: 6px; pointer-events: none; }
.blk {
  position: absolute; top: 3px; bottom: 3px; border: 0; border-radius: 5px; padding: 0 7px;
  background: var(--court); color: var(--court-ink); font-size: .8rem; font-weight: 600; text-align: left;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
}
.blk small { font-weight: 500; opacity: .85; font-variant-numeric: tabular-nums; }
.blk:hover { filter: brightness(1.08); }
/* Provisional: holding the court, no players named yet. Hatched outline so it reads as "pencilled in". */
.blk.prov {
  background-color: var(--surface); color: var(--court); box-shadow: inset 0 0 0 1.5px var(--court);
  background-image: repeating-linear-gradient(135deg, transparent 0 5px, var(--court-soft) 5px 10px);
}
/* May have been cancelled: provisional and past the confirm deadline. */
.blk.risk { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 1.5px var(--warn); }

.key .k-prov { box-shadow: inset 0 0 0 1.5px var(--court); background: repeating-linear-gradient(135deg, transparent 0 2px, var(--court-soft) 2px 4px); }
.key .k-risk { background: var(--warn-soft); box-shadow: inset 0 0 0 1.5px var(--warn); }

/* Needs-players list */
.attention { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: grid; gap: 8px; }
.attention h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.2rem; letter-spacing: .01em; }
.attention ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.attention li button {
  width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-variant-numeric: tabular-nums;
}
.attention li button:hover { border-color: var(--court); }
.attention .what { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.attention .due { color: var(--muted); font-size: .88rem; margin-left: auto; }
.attention .lapsed .due, .attention .soon .due { color: var(--warn); font-weight: 600; }
.tag { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: var(--court-soft); color: var(--court); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.add { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-size: 1.1rem; line-height: 1; color: var(--court); padding: 0; }
.add:hover:not(:disabled) { border-color: var(--court); }
.add:disabled { opacity: .35; cursor: not-allowed; }
.lockednote { font-size: .85rem; color: var(--muted); }

/* Players */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; }
.panel h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.5rem; }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; }
.addrow input { flex: 1 1 200px; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.people { list-style: none; margin: 0; padding: 0; display: grid; }
.people li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.people li:first-child { border-top: 0; }
.people .name { font-weight: 600; flex: 1 1 140px; min-width: 0; overflow-wrap: anywhere; }
.people .stat { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.people .confirm { font-size: .88rem; color: var(--warn); }
.empty { color: var(--muted); margin: 0; }
.linklike { border: 0; background: none; padding: 0; color: var(--court); font-weight: 600; text-decoration: underline; }

/* Booking form */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: grid; align-items: end; justify-items: center; }
@media (min-width: 640px) { .scrim { align-items: center; } }
.sheet {
  width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; background: var(--surface);
  border-radius: 14px 14px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px;
}
@media (min-width: 640px) { .sheet { border-radius: 14px; } }
.sheet h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.6rem; line-height: 1.1; }
.sheet .when { color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.field { display: grid; gap: 7px; }
.flabel { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.picker { display: flex; flex-wrap: wrap; gap: 6px; }
.picker label { position: relative; }
.picker input { position: absolute; opacity: 0; pointer-events: none; }
.picker span { display: inline-block; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-weight: 500; cursor: pointer; font-variant-numeric: tabular-nums; }
.picker input:checked + span { background: var(--court); border-color: var(--court); color: var(--court-ink); }
.picker input:focus-visible + span { outline: 2px solid var(--court); outline-offset: 2px; }
.timerow { display: flex; flex-wrap: wrap; align-items: end; gap: 14px; }
select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-variant-numeric: tabular-nums; }
.result { font-variant-numeric: tabular-nums; font-weight: 600; }
.result .note { font-weight: 400; color: var(--muted); }
.result.bad { color: var(--warn); }
.field input[type="text"] { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; width: 100%; }
.hint { font-size: .85rem; color: var(--muted); margin: 0; }
.result .state { display: block; margin-top: 3px; font-weight: 500; }
.result .state.prov { color: var(--court); }
.others { margin: 0; padding: 0; list-style: none; font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions .spacer { flex: 1; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-weight: 500; z-index: 30; max-width: calc(100% - 32px); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; }
.toggle input { width: 17px; height: 17px; accent-color: var(--court); margin: 0; }
.statusbox { display: grid; gap: 6px; }

/* Player pickers in the booking form */
.opps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 460px) { .opps { grid-template-columns: minmax(0, 1fr); } }
.opps select { width: 100%; min-width: 0; }

/* Attendance */
.att { border-top: 1px solid var(--line); padding-top: 10px; }
.att summary { cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; list-style: none; }
.att summary::-webkit-details-marker { display: none; }
.att summary::before { content: "▸"; color: var(--muted); font-size: .8rem; width: .8em; }
.att[open] summary::before { content: "▾"; }
.att-title { font-family: var(--display); font-weight: 700; font-size: 1.15rem; }
.att-sum { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.att-sum .bad { color: var(--warn); font-weight: 600; }
.att-body { display: grid; gap: 10px; margin-top: 10px; }
.att-list { list-style: none; margin: 0; padding: 0; display: grid; }
.att-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 7px 0; border-top: 1px solid var(--line); }
.att-row:first-child { border-top: 0; }
.att-who { flex: 1 1 180px; min-width: 0; display: grid; }
.att-name { font-weight: 600; overflow-wrap: anywhere; }
.att-role { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.att-role .mark { color: var(--warn); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; font-weight: 500; font-size: .88rem; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg .yes[aria-pressed="true"] { background: var(--court); color: var(--court-ink); }
.seg .no[aria-pressed="true"] { background: var(--warn); color: var(--surface); }
.x { border: 0; background: none; color: var(--muted); font-size: 1.2rem; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.x:hover { color: var(--warn); }
.att-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.att-foot select { flex: 1 1 200px; min-width: 0; }

/* Players view */
.people .pid { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.people .who { flex: 1 1 160px; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.people .stat .bad { color: var(--warn); font-weight: 600; }
.people input[type="text"] { flex: 1 1 160px; min-width: 0; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.search { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); width: 100%; }
.marks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
.marks li { display: flex; flex-wrap: wrap; gap: 2px 10px; padding: 7px 10px; border-radius: 8px; background: var(--warn-soft); }
.marks li b { color: var(--warn); }
.marks .meta { color: var(--ink); font-size: .9rem; }
</style>
</head>
<body data-viewer="<?= viewer ?>">
<div class="wrap">
  <header class="top">
    <div>
      <h1><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="white" cx="0.52" cy="0.48" r="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="0.62" stop-color="#fffdf8"/><stop offset="1" stop-color="#f4ecdb"/></radialGradient><radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5"><stop offset="0.72" stop-color="#8a7a50" stop-opacity=".28"/><stop offset="1" stop-color="#8a7a50" stop-opacity="0"/></radialGradient><radialGradient id="yolk" cx="0.36" cy="0.32" r="0.78"><stop offset="0" stop-color="#ecff4d"/><stop offset="0.5" stop-color="#cde21a"/><stop offset="1" stop-color="#93ab0a"/></radialGradient><clipPath id="ball"><circle cx="33" cy="31" r="14.9"/></clipPath></defs><path d="M30 4.5c7.5-.8 12.6 3.4 17.4 6.6 5.6 3.7 12.4 6.2 12.6 14.2.2 7-4.6 10.6-5.4 16.4-.9 6.3-3.6 13.6-12.4 16.4-8.2 2.6-14.4-1.4-20.6-3.3C15.4 53 7 51.6 4.6 43.1 2.4 35.4 7.4 30.6 7.8 23.8 8.3 15.4 13.2 6.6 30 4.5z"fill="url(#white)" stroke="#d9a85b" stroke-opacity=".7" stroke-width="1.5" stroke-linejoin="round"/><circle cx="34" cy="33" r="19.5" fill="url(#shadow)"/><circle cx="33" cy="31" r="16.2" fill="url(#yolk)"/><g clip-path="url(#ball)" fill="none" stroke-linecap="round"><g stroke="#6f8a05" stroke-opacity=".55" stroke-width="5.4"><path d="M19.7 17.4c6.7 4.8 7.9 21.9.5 28.2"/><path d="M46.3 16.6c-7.4 5.7-6.3 22.8.5 28.2"/></g><g stroke="#ffffff" stroke-width="3.2"><path d="M19.7 17.4c6.7 4.8 7.9 21.9.5 28.2"/><path d="M46.3 16.6c-7.4 5.7-6.3 22.8.5 28.2"/></g></g></svg>Breakfast <span>Tennis</span></h1>

<script>
(function () {
  // Filled from the Settings tab on every load.
  var CFG = { courts: 0, lengths: [60, 90, 120], step: 30, bookAheadDays: 9, confirmHours: 72 };
  var HOUR = 3600000;
  var SESSIONS = {};   // day number (0 = Sunday) -> {start, end} in minutes
  var ORDER = [];      // session day numbers, Monday first

  var S = {
    loaded: false, busy: false, today: null, skew: 0,
    players: [], byId: {},
    bookings: [],      // {id, date, court, start, end, minutes, status, bookerId, opponentIds, startsAt}
    attendance: [],    // {date, playerId, status: "Attended" | "No-show" | "", added}
    marks: [],         // {date, playerId, court, start, end, role}
    weekStart: mondayOf(new Date()),
    tab: "sessions", edit: null, openAtt: {}, query: "", renaming: null, confirmRemove: null
  };

  // ---------- dates & times ----------
  function pad(n) { return String(n).padStart(2, "0"); }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function mondayOf(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); }
  function parse(s) { var p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DAY = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  function short(d) { return DAY[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()]; }
  function toMin(t) { var p = t.split(":"); return Number(p[0]) * 60 + Number(p[1]); }
  function hm(m) { return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
  function sessionDates(ws) { return ORDER.map(function (dow) { return addDays(ws, dow === 0 ? 6 : dow - 1); }); }
  function todayDate() { return S.today ? parse(S.today) : parse(ymd(new Date())); }
  function nowMs() { return Date.now() + S.skew; } // server clock, so a wrong phone clock can't mislead
  function localStart(date, startMin) { var d = parse(date); d.setHours(0, startMin, 0, 0); return d.getTime(); }
  function when(ms) { var d = new Date(ms); return short(d) + " " + hm(d.getHours() * 60 + d.getMinutes()); }
  function untilText(ms) {
    var h = Math.round((ms - nowMs()) / HOUR);
    return h < 1 ? "within the hour" : h < 48 ? "in " + h + " hour" + (h === 1 ? "" : "s") : "in " + Math.round(h / 24) + " days";
  }

  // ---------- utils ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var toastTimer;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2800); }
  function setStatus(msg) { var s = $("status"); s.textContent = msg || ""; s.hidden = !msg; }
  function call(fn, arg) {
    return new Promise(function (res, rej) {
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
      if (arg === undefined) r[fn](); else r[fn](arg);
    });
  }
  function errMsg(e) { return (e && e.message ? e.message : String(e)).replace(/^Exception:\s*/, ""); }
  function pname(id) { var p = S.byId[id]; return p ? p.name : "Unknown player"; }
  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  // ---------- booking status ----------
  // "confirmed" — Confirmed (players named, or made inside the confirm window)
  // "prov"      — Provisional, before the confirm deadline
  // "risk"      — Provisional and past the deadline: the club may have cancelled it
  // "past"      — Provisional and already started
  function deadline(b) { return b.startsAt - CFG.confirmHours * HOUR; }
  function bstatus(b) {
    if (b.status !== "Provisional") return "confirmed";
    if (b.startsAt <= nowMs()) return "past";
    return nowMs() >= deadline(b) ? "risk" : "prov";
  }
  function teamText(b) {
    var o = b.opponentIds;
    return pname(b.bookerId) + (o.length === 1 ? " v " + pname(o[0]) : o.length ? " +" + o.length : "");
  }
  function teamFull(b) {
    return pname(b.bookerId) + (b.opponentIds.length ? " with " + b.opponentIds.map(pname).join(", ") : ", no other players yet");
  }

  // Bookings on one court for one date, sorted by start, as minutes.
  function courtBookings(date, court, exceptId) {
    return S.bookings.filter(function (b) { return b.date === date && b.court === court && b.id !== exceptId; })
      .map(function (b) { return { b: b, s: toMin(b.start), e: toMin(b.end) }; })
      .sort(function (x, y) { return x.s - y.s; });
  }
  // How much of the session window a court's bookings cover: "full", "part" or "free".
  function coverage(list, ws, we) {
    var t = ws, any = false;
    list.forEach(function (x) {
      if (x.e > ws && x.s < we) any = true;
      if (x.s <= t && x.e > t) t = x.e;
    });
    return t >= we ? "full" : any ? "part" : "free";
  }
  // First minute from session start that isn't covered, and the next booking start after it.
  function firstGap(list, ws) {
    var t = ws;
    list.forEach(function (x) { if (x.s <= t && x.e > t) t = x.e; });
    var next = Infinity;
    list.forEach(function (x) { if (x.s >= t && x.s < next) next = x.s; });
    return { start: t, next: next };
  }

  // ---------- attendance ----------
  function attRow(date, pid) { return S.attendance.filter(function (a) { return a.date === date && a.playerId === pid; })[0]; }
  // Everyone named on that session's bookings, plus anyone else with an attendance record.
  function sessionPlayers(date) {
    var map = {}, out = [];
    function get(pid) {
      if (!map[pid]) { map[pid] = { id: pid, roles: [], status: "", added: false, onBooking: false }; out.push(map[pid]); }
      return map[pid];
    }
    S.bookings.filter(function (b) { return b.date === date; })
      .sort(function (a, b) { return (a.start + pad(a.court)).localeCompare(b.start + pad(b.court)); })
      .forEach(function (b) {
        var r = get(b.bookerId); r.onBooking = true; r.roles.push("Court " + b.court + " " + b.start + " · booker");
        b.opponentIds.forEach(function (pid) { var o = get(pid); o.onBooking = true; o.roles.push("Court " + b.court + " " + b.start + " · player"); });
      });
    S.attendance.filter(function (a) { return a.date === date; }).forEach(function (a) { var r = get(a.playerId); r.status = a.status; r.added = a.added; });
    return out.sort(function (a, b) { return pname(a.id).localeCompare(pname(b.id)); });
  }

  // ---------- data ----------
  function applyConfig(cfg) {
    CFG = cfg;
    if (CFG.confirmHours == null) CFG.confirmHours = 72;
    SESSIONS = {}; ORDER = [];
    cfg.sessions.forEach(function (s) { SESSIONS[s.dow] = { start: toMin(s.start), end: toMin(s.end) }; ORDER.push(s.dow); });
    var groups = [];
    cfg.sessions.forEach(function (s) {
      var t = s.start + "–" + s.end, g = groups.filter(function (x) { return x.t === t; })[0];
      if (g) g.days.push(DAY[s.dow]); else groups.push({ t: t, days: [DAY[s.dow]] });
    });
    $("subtitle").textContent = "Court bookings · " + groups.map(function (g) {
      return g.days.join(g.days.length === 2 ? " & " : ", ") + " " + g.t;
    }).join(" · ");
  }
  function apply(data) {
    S.today = data.today;
    if (data.now) S.skew = data.now - Date.now();
    applyConfig(data.config);
    S.players = data.players;
    S.byId = {}; S.players.forEach(function (p) { S.byId[p.id] = p; });
    S.bookings = data.bookings;
    S.attendance = data.attendance || [];
    S.marks = data.marks || [];
    if (!S.loaded) { S.loaded = true; S.weekStart = mondayOf(parse(data.today)); }
    setStatus("");
    render();
  }
  function load() {
    return call("getData").then(apply).catch(function (e) {
      var m = errMsg(e);
      var who = document.body.getAttribute("data-viewer") || "";
      var acct = who ? " You're signed in as " + who + "." : " Google didn't say which account you're signed in with.";
      if (/authori[sz]ation is required/i.test(m)) {
        setStatus("Google couldn't tell which of your accounts to use. This happens when you're signed in to more than one Google account. Open the link in a private window, sign in with only the account the sheet is shared with, and try again." + acct + " (Google said: " + m + ")");
      } else if (/permission|access denied|not have access|requested entity/i.test(m) && !/Settings tab|Bookings tab/.test(m)) {
        setStatus("This Google account can't open the bookings sheet." + acct + " Ask the club admin to share the sheet with that exact address as an Editor, then reload. (Google said: " + m + ")");
      } else {
        setStatus("Couldn't load bookings: " + m + acct);
      }
    });
  }
  function write(fn, arg, okMsg) {
    S.busy = true;
    return call(fn, arg).then(function (data) {
      S.busy = false; apply(data); if (okMsg) toast(okMsg);
    }).catch(function (e) {
      S.busy = false; toast(errMsg(e)); load();
    });
  }

  // ---------- render: needs players ----------
  // Provisional bookings past their deadline, plus those whose deadline is within 2 days.
  function renderAttention() {
    var el = $("attention");
    if (!S.loaded) { el.hidden = true; return; }
    var soon = nowMs() + 48 * HOUR;
    var items = S.bookings.filter(function (b) {
      var st = bstatus(b);
      return st === "risk" || (st === "prov" && deadline(b) <= soon);
    }).sort(function (a, b) { return deadline(a) - deadline(b); });
    if (!items.length) { el.hidden = true; el.innerHTML = ""; return; }
    var risky = items.filter(function (b) { return bstatus(b) === "risk"; }).length;
    el.innerHTML = '<h2>Needs players</h2>' +
      '<p class="hint">The club cancels provisional bookings that have no players named ' + CFG.confirmHours + ' hours before they start.' +
      (risky ? ' Bookings marked "Cancelled?" are past that point: check the club system, then name the players, mark it confirmed, or delete it.' : '') + '</p>' +
      '<ul>' + items.map(function (b) {
        var st = bstatus(b), dl = deadline(b);
        var cls = st === "risk" ? "lapsed" : dl - nowMs() < 12 * HOUR ? "soon" : "";
        return '<li class="' + cls + '"><button type="button" data-open="' + esc(b.id) + '">' +
          (st === "risk" ? '<span class="tag warn">Cancelled?</span>' : '<span class="tag">Prov</span>') +
          '<span class="what">Court ' + b.court + ' · ' + short(parse(b.date)) + ' ' + b.start + ' · ' + esc(pname(b.bookerId)) + '</span>' +
          '<span class="due">' + (st === "risk" ? "Deadline was " + when(dl) : "Name by " + when(dl) + " (" + untilText(dl) + ")") + '</span>' +
          '</button></li>';
      }).join("") + '</ul>';
    el.hidden = false;
  }

  // ---------- render: sessions ----------
  function renderSessions() {
    if (!S.loaded) { $("tally").textContent = ""; return; }
    var today = todayDate();
    var isThisWeek = ymd(S.weekStart) === ymd(mondayOf(today));
    var end = addDays(S.weekStart, 6);
    $("weeklabel").textContent = (isThisWeek ? "This week · " : "") + S.weekStart.getDate() + " " + MON[S.weekStart.getMonth()] + " – " + end.getDate() + " " + MON[end.getMonth()];
    $("thisweek").hidden = isThisWeek;

    var totalFull = 0, totalCourts = 0;
    $("sessions").innerHTML = sessionDates(S.weekStart).map(function (d) {
      var date = ymd(d), s = SESSIONS[d.getDay()];
      var daysOut = Math.round((d - today) / 86400000);
      var locked = daysOut > CFG.bookAheadDays;
      var day = S.bookings.filter(function (b) { return b.date === date && b.court <= CFG.courts; });

      // Axis spans the session plus any bookings that start earlier or finish later.
      var a0 = s.start, a1 = s.end;
      day.forEach(function (b) { a0 = Math.min(a0, toMin(b.start)); a1 = Math.max(a1, toMin(b.end)); });
      var span = a1 - a0;
      function pct(m) { return ((m - a0) / span * 100).toFixed(3) + "%"; }

      var tickStep = span > 210 ? 60 : 30, ticks = [];
      for (var t = Math.ceil(a0 / tickStep) * tickStep; t <= a1; t += tickStep) {
        var cls = t === a0 ? "first" : t === a1 ? "last" : "";
        ticks.push('<span class="' + cls + '" style="left:' + pct(t) + '">' + hm(t) + '</span>');
      }

      var n = { full: 0, part: 0, free: 0, prov: 0, risk: 0 }, rows = [];
      for (var c = 1; c <= CFG.courts; c++) {
        var list = courtBookings(date, c);
        var cov = coverage(list, s.start, s.end);
        n[cov]++;
        var blocks = list.map(function (x) {
          var b = x.b, st = bstatus(b);
          if (st === "prov") n.prov++;
          if (st === "risk") n.risk++;
          var note = st === "prov" ? "Provisional: name players by " + when(deadline(b))
            : st === "risk" ? "May have been cancelled: no players named by " + when(deadline(b))
            : st === "past" ? "Was provisional" : "Confirmed";
          var label = st === "prov" ? '<span class="tag">Prov</span> ' : st === "risk" ? '<span class="tag warn">Cancelled?</span> ' : "";
          var desc = teamFull(b) + " · " + b.start + "–" + b.end + " · " + note;
          return '<button class="blk' + (st === "prov" || st === "past" ? " prov" : st === "risk" ? " risk" : "") + '" data-id="' + esc(b.id) + '"' +
            ' style="left:calc(' + pct(x.s) + ' + 1px);width:calc(' + ((x.e - x.s) / span * 100).toFixed(3) + '% - 2px)"' +
            ' title="' + esc(desc) + '" aria-label="Court ' + c + ', ' + esc(desc) + '">' +
            label + '<span class="nm">' + esc(teamText(b)) + '</span> <small>' + b.start + '–' + b.end + '</small></button>';
        }).join("");
        rows.push('<div class="row"><span class="num ' + cov + '" title="' + (cov === "full" ? "Covered" : cov === "part" ? "Partly covered" : "Not booked") + '">' + c + '</span>' +
          '<div class="lane' + (locked ? ' locked' : '') + '" data-date="' + date + '" data-court="' + c + '" data-a0="' + a0 + '" data-span="' + span + '">' +
          '<div class="win" style="left:' + pct(s.start) + ';width:' + ((s.end - s.start) / span * 100).toFixed(3) + '%"></div>' + blocks + '</div>' +
          '<button class="add" data-date="' + date + '" data-court="' + c + '" aria-label="Add a booking on court ' + c + '"' + (locked ? ' disabled' : '') + '>+</button></div>');
      }
      totalFull += n.full; totalCourts += CFG.courts;

      var past = Date.now() > new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, Math.max(s.end, a1)).getTime();
      var chip = "";
      if (past) chip = '<span class="chip plain">Played</span>';
      else if (daysOut === 0) chip = '<span class="chip">Today</span>';
      else if (locked) chip = '<span class="chip plain">Opens ' + short(addDays(d, -CFG.bookAheadDays)) + '</span>';
      else if (daysOut === CFG.bookAheadDays) chip = '<span class="chip">Opened today</span>';

      return '<article class="session' + (past ? ' past' : '') + '">' +
        '<div class="session-head"><h2>' + short(d) + '</h2><span class="time">' + hm(s.start) + '–' + hm(s.end) + '</span>' + chip +
        '<span class="count"><span class="key"><i class="k-full"></i><b>' + n.full + '</b> covered</span>' +
        '<span class="key"><i class="k-part"></i><b>' + n.part + '</b> partly</span>' +
        '<span class="key"><i class="k-free"></i><b>' + n.free + '</b> free</span>' +
        (n.prov ? '<span class="key"><i class="k-prov"></i><b>' + n.prov + '</b> provisional</span>' : '') +
        (n.risk ? '<span class="key"><i class="k-risk"></i><b>' + n.risk + '</b> may be cancelled</span>' : '') + '</span></div>' +
        (locked ? '<div class="lockednote">Bookings for this session open on ' + short(addDays(d, -CFG.bookAheadDays)) + '.</div>' : '') +
        '<div class="board"><div class="row"><span></span><div class="axis">' + ticks.join("") + '</div><span></span></div>' + rows.join("") + '</div>' +
        (locked ? '' : renderAttendance(date)) + '</article>';
    }).join("");
    $("tally").textContent = totalFull + " of " + totalCourts + " courts fully covered";
  }

  function renderAttendance(date) {
    var list = sessionPlayers(date);
    var n = { Attended: 0, "No-show": 0, none: 0 };
    list.forEach(function (p) { n[p.status || "none"]++; });
    var sum = list.length
      ? plural(list.length, "player") + " · " + n.Attended + " attended" +
        (n["No-show"] ? ' · <span class="bad">' + n["No-show"] + " no-show</span>" : "") +
        (n.none ? " · " + n.none + " not checked" : "")
      : "No players yet";
    var rows = list.map(function (p) {
      var nm = esc(pname(p.id));
      var role = p.roles.length ? p.roles.map(esc).join("<br>") : p.added ? "Added to this session" : "Not on a booking";
      if (p.status === "No-show" && p.onBooking) role += ' · <span class="mark">black mark</span>';
      return '<li class="att-row"><div class="att-who"><span class="att-name">' + nm + '</span><span class="att-role">' + role + '</span></div>' +
        '<div class="seg" role="group" aria-label="Attendance for ' + nm + '">' +
        '<button type="button" class="yes" aria-pressed="' + (p.status === "Attended") + '" data-act="att-set" data-date="' + date + '" data-pid="' + esc(p.id) + '" data-st="Attended">Attended</button>' +
        '<button type="button" class="no" aria-pressed="' + (p.status === "No-show") + '" data-act="att-set" data-date="' + date + '" data-pid="' + esc(p.id) + '" data-st="No-show">No-show</button></div>' +
        (p.onBooking ? '' : '<button type="button" class="x" data-act="att-remove" data-date="' + date + '" data-pid="' + esc(p.id) + '" aria-label="Remove ' + nm + ' from this session">×</button>') +
        '</li>';
    }).join("");
    var listed = {}; list.forEach(function (p) { listed[p.id] = true; });
    var others = S.players.filter(function (p) { return !listed[p.id]; });
    return '<details class="att" data-att="' + date + '"' + (S.openAtt[date] ? ' open' : '') + '>' +
      '<summary><span class="att-title">Attendance</span><span class="att-sum">' + sum + '</span></summary><div class="att-body">' +
      (list.length ? '<ul class="att-list">' + rows + '</ul>' : '<p class="empty">No one is named on a booking for this session yet.</p>') +
      '<div class="att-foot"><select id="addatt-' + date + '" aria-label="Add a player who came to this session">' +
      '<option value="">Add a player who came…</option>' + others.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join("") + '</select>' +
      '<button type="button" class="btn" data-act="att-add" data-date="' + date + '">Add</button>' +
      (n.none ? '<button type="button" class="btn" data-act="att-all" data-date="' + date + '">Mark the rest attended</button>' : '') +
      '</div></div></details>';
  }

  function setAtt(date, entries, msg) {
    entries.forEach(function (e) {
      S.attendance = S.attendance.filter(function (a) { return !(a.date === date && a.playerId === e.playerId); });
      if (!e.remove && (e.status || e.added)) S.attendance.push({ date: date, playerId: e.playerId, status: e.status || "", added: !!e.added });
    });
    renderSessions();
    write("setAttendance", { date: date, entries: entries }, msg);
  }

  // ---------- render: players ----------
  function renderPlayers() {
    var todayStr = S.today || ymd(new Date());
    var upcoming = {}, marks = {};
    S.bookings.forEach(function (b) {
      if (b.date < todayStr) return;
      [b.bookerId].concat(b.opponentIds).forEach(function (pid) { upcoming[pid] = (upcoming[pid] || 0) + 1; });
    });
    S.marks.forEach(function (m) { marks[m.playerId] = (marks[m.playerId] || 0) + 1; });

    $("marks").innerHTML = '<div><h2>Black marks</h2><p class="sub">No-shows by players named on a booking, over the last 12 months. Record them in each session’s attendance.</p></div>' +
      (S.marks.length ? '<ul class="marks">' + S.marks.map(function (m) {
        return '<li><b>' + esc(pname(m.playerId)) + '</b><span class="meta">' + short(parse(m.date)) + ' · Court ' + m.court + ' ' + m.start + '–' + m.end + ' · ' + m.role + '</span></li>';
      }).join("") + '</ul>' : '<p class="empty">' + (S.loaded ? 'No black marks.' : 'Loading…') + '</p>');

    var q = S.query.trim().toLowerCase();
    var list = S.players.filter(function (p) { return !q || p.name.toLowerCase().indexOf(q) !== -1 || p.id.toLowerCase() === q; });
    if (!S.players.length) { $("people").innerHTML = '<li><p class="empty">' + (S.loaded ? 'No players yet. Add the first name above.' : 'Loading…') + '</p></li>'; return; }
    if (!list.length) { $("people").innerHTML = '<li><p class="empty">No players match “' + esc(S.query) + '”.</p></li>'; return; }
    $("people").innerHTML = list.map(function (p) {
      var id = esc(p.id);
      if (S.renaming === p.id) {
        return '<li><input type="text" id="rename-' + id + '" value="' + esc(p.name) + '" maxlength="40" aria-label="New name for ' + esc(p.name) + '">' +
          '<button class="btn primary" data-act="rename-save" data-id="' + id + '">Save</button><button class="btn" data-act="rename-cancel">Cancel</button></li>';
      }
      var mk = marks[p.id] || 0, up = upcoming[p.id] || 0;
      var right = S.confirmRemove === p.id
        ? '<span class="confirm">Remove ' + esc(p.name) + '?</span><button class="btn danger" data-act="remove-yes" data-id="' + id + '">Remove</button><button class="btn" data-act="remove-no">Keep</button>'
        : '<label class="toggle"><input type="checkbox" data-act="booker" data-id="' + id + '"' + (p.booker ? ' checked' : '') + '> Booker</label>' +
          '<button class="btn" data-act="rename" data-id="' + id + '">Rename</button>' +
          '<button class="btn danger" data-act="remove" data-id="' + id + '">Remove</button>';
      return '<li><span class="who"><span class="name">' + esc(p.name) + '</span><span class="pid">' + id + '</span></span>' +
        '<span class="stat">' + plural(up, "upcoming booking") + (mk ? ' · <span class="bad">' + plural(mk, "black mark") + '</span>' : '') + '</span>' + right + '</li>';
    }).join("");
  }

  // ---------- booking form ----------
  // S.edit = {id?, date, court, start (min), minutes, bookerId, opponentIds: [3 slots], status, statusTouched, origStatus}
  function defaultStatus(ed) {
    if (ed.id) return ed.origStatus;
    return localStart(ed.date, ed.start) - CFG.confirmHours * HOUR > nowMs() ? "Provisional" : "Confirmed";
  }
  function openNew(date, court, startMin) {
    var s = SESSIONS[parse(date).getDay()];
    var list = courtBookings(date, court);
    var minLen = CFG.lengths[0], len = minLen, start;
    if (startMin == null) {
      var g = firstGap(list, s.start);
      start = g.start;
      if (start < s.end) {
        var room = Math.min(g.next, s.end) - start;
        CFG.lengths.forEach(function (l) { if (l <= room) len = l; });
      }
    } else {
      start = startMin;
      var next = Infinity;
      list.forEach(function (x) { if (x.s >= start && x.s < next) next = x.s; });
      var room2 = Math.min(next, Math.max(s.end, start + minLen)) - start;
      CFG.lengths.forEach(function (l) { if (l <= room2) len = l; });
    }
    S.edit = { id: null, date: date, court: court, start: start, minutes: len, bookerId: "", opponentIds: ["", "", ""], statusTouched: false };
    S.edit.status = defaultStatus(S.edit);
    renderSheet();
  }
  function openExisting(id) {
    var b = S.bookings.filter(function (x) { return x.id === id; })[0];
    if (!b) return;
    var o = b.opponentIds.slice(0, 3); while (o.length < 3) o.push("");
    S.edit = { id: b.id, date: b.date, court: b.court, start: toMin(b.start), minutes: b.minutes, bookerId: b.bookerId,
      opponentIds: o, status: b.status, origStatus: b.status, statusTouched: false };
    renderSheet();
  }
  function startOptions(s, current) {
    var maxLen = CFG.lengths[CFG.lengths.length - 1], opts = {};
    var lo = Math.ceil((s.start - maxLen + CFG.step) / CFG.step) * CFG.step;
    for (var t = Math.max(0, lo); t < s.end; t += CFG.step) opts[t] = true;
    if (current != null) opts[current] = true;
    return Object.keys(opts).map(Number).sort(function (a, b) { return a - b; });
  }
  function chosenOpps(ed) { return ed.opponentIds.filter(Boolean); }
  // Returns an error message for the current form, or "".
  function problem(ed) {
    var s = SESSIONS[parse(ed.date).getDay()];
    var st = ed.start, en = ed.start + ed.minutes;
    if (en > 24 * 60) return "A booking can't run past midnight.";
    if (!(st < s.end && en > s.start)) return "This doesn't overlap the " + hm(s.start) + "–" + hm(s.end) + " session.";
    var clash = courtBookings(ed.date, ed.court, ed.id).filter(function (x) { return x.s < en && st < x.e; })[0];
    if (clash) return "Clashes with " + pname(clash.b.bookerId) + " " + clash.b.start + "–" + clash.b.end + ".";
    var opps = chosenOpps(ed);
    for (var i = 0; i < opps.length; i++) {
      if (opps.indexOf(opps[i]) !== i) return pname(opps[i]) + " is picked twice.";
      if (ed.bookerId && opps[i] === ed.bookerId) return pname(opps[i]) + " booked the court, so can't also be listed as a player.";
    }
    return "";
  }
  function renderResult() {
    var ed = S.edit, el = $("result"); if (!ed || !el) return;
    var s = SESSIONS[parse(ed.date).getDay()];
    var p = problem(ed), en = ed.start + ed.minutes, notes = [];
    if (ed.start < s.start) notes.push("starts before the session");
    if (en > s.end) notes.push("runs past the session");
    el.className = "result" + (p ? " bad" : "");
    el.innerHTML = p ? esc(p) : hm(ed.start) + "–" + hm(en) + (notes.length ? ' <span class="note">· ' + notes.join(", ") + '</span>' : '');
    $("save").disabled = !!p;

    // Status: confirmed once players are named; otherwise the admin can choose.
    var opps = chosenOpps(ed).length, box = $("statusfield"), hint = $("statushint");
    if (!ed.statusTouched && !ed.id) ed.status = defaultStatus(ed);
    box.hidden = opps > 0;
    $("st-Provisional").checked = ed.status === "Provisional";
    $("st-Confirmed").checked = ed.status === "Confirmed";
    var at = localStart(ed.date, ed.start), dl = at - CFG.confirmHours * HOUR;
    if (opps) hint.textContent = "Confirmed: players named.";
    else if (ed.status === "Confirmed") hint.textContent = ed.id ? "Confirmed without players named." : dl <= nowMs() ? "Made inside " + CFG.confirmHours + " hours of the booking, so it starts as confirmed." : "Confirmed without players named.";
    else if (at <= nowMs()) hint.textContent = "This booking has started.";
    else if (dl <= nowMs()) hint.textContent = "Past the " + when(dl) + " deadline: the club may have cancelled it. Check the club system.";
    else hint.textContent = "Name players by " + when(dl) + ", or the club cancels it.";
    $("statushint-wrap").hidden = false;
  }
  function playerOptions(selected, blank) {
    var opts = S.players.slice();
    if (selected && !S.byId[selected]) opts.unshift({ id: selected, name: "Unknown player (" + selected + ")" });
    return '<option value="">' + blank + '</option>' + opts.map(function (p) {
      return '<option value="' + esc(p.id) + '"' + (p.id === selected ? ' selected' : '') + '>' + esc(p.name) + '</option>';
    }).join("");
  }
  function renderSheet() {
    var w = $("sheetwrap");
    if (!S.edit) { w.hidden = true; w.innerHTML = ""; return; }
    var ed = S.edit, d = parse(ed.date), s = SESSIONS[d.getDay()];
    var others = courtBookings(ed.date, ed.court, ed.id);
    var bookers = S.players.filter(function (p) { return p.booker; });
    if (ed.bookerId && !bookers.some(function (p) { return p.id === ed.bookerId; })) bookers.unshift({ id: ed.bookerId, name: pname(ed.bookerId) });
    var picker = bookers.length
      ? '<div class="picker" role="radiogroup" aria-label="Booked by">' + bookers.map(function (p) {
          return '<label><input type="radio" name="who" value="' + esc(p.id) + '"' + (ed.bookerId === p.id ? ' checked' : '') + '><span>' + esc(p.name) + '</span></label>';
        }).join("") + '</div>'
      : '<p class="empty">No bookers yet. <button type="button" class="linklike" data-act="go-players">Tick Booker on the Players list</button> first.</p>';
    var starts = startOptions(s, ed.start).map(function (t) {
      return '<option value="' + t + '"' + (t === ed.start ? ' selected' : '') + '>' + hm(t) + '</option>';
    }).join("");
    var lens = CFG.lengths.slice();
    if (lens.indexOf(ed.minutes) === -1) lens.push(ed.minutes);
    var lenPicker = lens.map(function (l) {
      return '<label><input type="radio" name="len" value="' + l + '"' + (l === ed.minutes ? ' checked' : '') + '><span>' + l + ' min</span></label>';
    }).join("");
    var opps = [0, 1, 2].map(function (i) {
      return '<select id="opp-' + i + '" data-slot="' + i + '" aria-label="Player ' + (i + 1) + '">' + playerOptions(ed.opponentIds[i], "Player " + (i + 1)) + '</select>';
    }).join("");

    w.innerHTML = '<div class="scrim" data-act="close"><form class="sheet" id="bookform" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' +
      '<div><h3 id="sheet-title">' + (ed.id ? 'Court ' + ed.court + ' booking' : 'Book court ' + ed.court) + '</h3>' +
      '<div class="when">' + short(d) + ' · session ' + hm(s.start) + '–' + hm(s.end) + '</div></div>' +
      (others.length ? '<div class="field"><span class="flabel">Also on court ' + ed.court + '</span><ul class="others">' + others.map(function (x) {
        return '<li>' + x.b.start + '–' + x.b.end + ' · ' + esc(teamText(x.b)) + (x.b.status === "Provisional" ? ' (provisional)' : '') + '</li>'; }).join("") + '</ul></div>' : '') +
      '<div class="field"><span class="flabel">Booked by</span>' + picker + '</div>' +
      '<div class="timerow"><div class="field"><label class="flabel" for="start">Start</label><select id="start">' + starts + '</select></div>' +
      '<div class="field"><span class="flabel">Length</span><div class="picker" role="radiogroup" aria-label="Length">' + lenPicker + '</div></div></div>' +
      '<div class="field"><span class="flabel">Players</span><div class="opps">' + opps + '</div>' +
      '<p class="hint">Up to 3 besides the booker, from the Players list. You don’t need to name everyone: one player confirms the booking. Missing someone? Add them on the Players tab.</p></div>' +
      '<div class="field statusbox"><div id="statusfield"><span class="flabel">Status</span><div class="picker" role="radiogroup" aria-label="Status">' +
      '<label><input type="radio" name="status" id="st-Provisional" value="Provisional"><span>Provisional</span></label>' +
      '<label><input type="radio" name="status" id="st-Confirmed" value="Confirmed"><span>Confirmed</span></label></div></div>' +
      '<div id="statushint-wrap"><p class="hint" id="statushint"></p></div></div>' +
      '<div id="result" class="result" aria-live="polite"></div>' +
      '<div class="actions">' + (ed.id ? '<button type="button" class="btn danger" data-act="delete">Delete booking</button>' : '') +
      '<span class="spacer"></span><button type="button" class="btn" data-act="close">Cancel</button>' +
      '<button type="submit" class="btn primary" id="save">Save</button></div></form></div>';
    w.hidden = false;
    renderResult();
    var first = w.querySelector('input[name="who"]:checked') || w.querySelector('input[name="who"]');
    (first || $("start")).focus();
  }

  function saveBooking() {
    var ed = S.edit; if (!ed) return;
    if (!ed.bookerId) { toast("Pick who booked the court."); return; }
    var p = problem(ed); if (p) { toast(p); return; }
    var opps = chosenOpps(ed);
    var status = opps.length ? "Confirmed" : ed.status;
    var payload = { id: ed.id || "", date: ed.date, court: ed.court, start: hm(ed.start), minutes: ed.minutes,
      bookerId: ed.bookerId, opponentIds: opps, status: status };
    // Show it straight away; the server's answer replaces this.
    var local = { id: ed.id || ("tmp" + Date.now()), date: ed.date, court: ed.court, start: payload.start, end: hm(ed.start + ed.minutes),
      minutes: ed.minutes, status: status, bookerId: ed.bookerId, opponentIds: opps, startsAt: localStart(ed.date, ed.start) };
    S.bookings = S.bookings.filter(function (b) { return b.id !== ed.id; }).concat([local]);
    S.edit = null; renderSheet(); renderAttention(); renderSessions();
    write("saveBooking", payload, "Court " + payload.court + " " + payload.start + "–" + local.end + " saved" + (status === "Provisional" ? " as provisional" : ""));
  }
  function deleteBooking() {
    var ed = S.edit; if (!ed || !ed.id) return;
    S.bookings = S.bookings.filter(function (b) { return b.id !== ed.id; });
    S.edit = null; renderSheet(); renderAttention(); renderSessions();
    write("deleteBooking", ed.id, "Booking deleted");
  }

  function render() {
    $("view-sessions").hidden = S.tab !== "sessions";
    $("view-players").hidden = S.tab !== "players";
    document.querySelectorAll(".tabs button").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)); });
    renderAttention();
    renderSessions();
    renderPlayers();
  }

  // ---------- events ----------
  document.addEventListener("click", function (e) {
    var tab = e.target.closest(".tabs button");
    if (tab) { S.tab = tab.dataset.tab; render(); return; }
    var opener = e.target.closest("[data-open]");
    if (opener) { openExisting(opener.dataset.open); return; }
    var blk = e.target.closest(".blk");
    if (blk) { openExisting(blk.dataset.id); return; }
    var add = e.target.closest(".add");
    if (add) { if (!add.disabled) openNew(add.dataset.date, Number(add.dataset.court), null); return; }
    var lane = e.target.closest(".lane");
    if (lane) {
      if (lane.classList.contains("locked")) { toast("Bookings for this session aren't open yet."); return; }
      var r = lane.getBoundingClientRect();
      var m = Number(lane.dataset.a0) + (e.clientX - r.left) / r.width * Number(lane.dataset.span);
      openNew(lane.dataset.date, Number(lane.dataset.court), Math.floor(m / CFG.step) * CFG.step);
      return;
    }
    var act = e.target.closest("[data-act]");
    if (!act || act.tagName === "INPUT") return;
    var a = act.dataset.act, date = act.dataset.date, pid = act.dataset.pid, id = act.dataset.id;
    if (a === "close") { if (e.target === act || act.tagName === "BUTTON") { S.edit = null; renderSheet(); } return; }
    if (a === "delete") deleteBooking();
    else if (a === "go-players") { S.edit = null; renderSheet(); S.tab = "players"; render(); }
    else if (a === "att-set") {
      var cur = attRow(date, pid), st = act.dataset.st;
      var next = cur && cur.status === st ? "" : st;
      setAtt(date, [{ playerId: pid, status: next, added: cur ? cur.added : false }]);
    }
    else if (a === "att-remove") setAtt(date, [{ playerId: pid, remove: true }], pname(pid) + " removed from the session");
    else if (a === "att-add") {
      var sel = $("addatt-" + date);
      if (!sel || !sel.value) { toast("Pick a player to add."); return; }
      setAtt(date, [{ playerId: sel.value, status: "Attended", added: true }], pname(sel.value) + " added as attended");
    }
    else if (a === "att-all") {
      var rest = sessionPlayers(date).filter(function (p) { return !p.status; });
      setAtt(date, rest.map(function (p) { return { playerId: p.id, status: "Attended", added: p.added }; }), plural(rest.length, "player") + " marked attended");
    }
    else if (a === "rename") { S.renaming = id; S.confirmRemove = null; renderPlayers(); var inp = $("rename-" + id); if (inp) { inp.focus(); inp.select(); } }
    else if (a === "rename-cancel") { S.renaming = null; renderPlayers(); }
    else if (a === "rename-save") {
      var name = ($("rename-" + id).value || "").trim().replace(/\s+/g, " ");
      S.renaming = null;
      if (name && name !== pname(id)) write("updatePlayer", { id: id, name: name }, "Renamed to " + name);
      else renderPlayers();
    }
    else if (a === "remove") { S.confirmRemove = id; S.renaming = null; renderPlayers(); }
    else if (a === "remove-no") { S.confirmRemove = null; renderPlayers(); }
    else if (a === "remove-yes") { var nm = pname(id); S.confirmRemove = null; write("removePlayer", id, nm + " removed"); }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.act === "booker") {
      var p = S.byId[t.dataset.id]; if (p) p.booker = t.checked;
      write("updatePlayer", { id: t.dataset.id, booker: t.checked }, pname(t.dataset.id) + (t.checked ? " can now book courts" : " is no longer a booker"));
      return;
    }
    if (!S.edit) return;
    if (t.id === "start") { S.edit.start = Number(t.value); renderResult(); }
    else if (t.name === "len") { S.edit.minutes = Number(t.value); renderResult(); }
    else if (t.name === "who") { S.edit.bookerId = t.value; renderResult(); }
    else if (t.name === "status") { S.edit.status = t.value; S.edit.statusTouched = true; renderResult(); }
    else if (t.dataset && t.dataset.slot != null) { S.edit.opponentIds[Number(t.dataset.slot)] = t.value; renderResult(); }
  });
  document.addEventListener("toggle", function (e) {
    var el = e.target;
    if (el.classList && el.classList.contains("att")) S.openAtt[el.dataset.att] = el.open;
  }, true);
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    if (e.target.id === "bookform") saveBooking();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && S.edit) { S.edit = null; renderSheet(); }
    if (e.key === "Enter" && e.target.id && e.target.id.indexOf("rename-") === 0) {
      e.preventDefault(); var btn = document.querySelector('[data-act="rename-save"]'); if (btn) btn.click();
    }
  });

  $("prev").onclick = function () { S.weekStart = addDays(S.weekStart, -7); renderSessions(); };
  $("next").onclick = function () { S.weekStart = addDays(S.weekStart, 7); renderSessions(); };
  $("thisweek").onclick = function () { S.weekStart = mondayOf(todayDate()); renderSessions(); };
  $("pquery").addEventListener("input", function (e) { S.query = e.target.value; renderPlayers(); });

  $("addform").addEventListener("submit", function (e) {
    e.preventDefault(); e.stopPropagation();
    var input = $("newname"), name = input.value.trim().replace(/\s+/g, " ");
    if (!name) return;
    if (S.players.some(function (p) { return p.name.toLowerCase() === name.toLowerCase(); })) { toast(name + " is already on the list"); return; }
    var booker = $("newbooker").checked;
    input.value = ""; $("newbooker").checked = false;
    write("addPlayer", { name: name, booker: booker }, name + " added");
  });

  // ---------- start ----------
  render();
  load();
  // Pick up other admins' changes every 30 seconds while the page is open (not while typing a rename).
  setInterval(function () { if (!document.hidden && !S.busy && !S.edit && !S.renaming) load(); }, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && !S.busy && !S.renaming) load(); });
})();
</script>
</body>
</html>
